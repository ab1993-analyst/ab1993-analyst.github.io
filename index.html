    html {

    footer {

        padding: 20px;

        background: #2c3e50;

        color: white;

    }



    /* FADE IN ANIMATION */



    .fade-in {

        opacity: 0;

        transform: translateY(30px);

        transition: all 0.8s ease-out;

    }



    .fade-in.show {

        opacity: 1;

        transform: translateY(0);

    }



    /* MOBILE RESPONSIVE */



    @media (max-width: 768px) {



        .masthead-heading {

            font-size: 2rem;

        }



        .portfolio-item {

            margin-bottom: 30px;

        }



        .dashboard-gallery img {

        }



        .contact-icons a {

            margin: 10px;

            display: inline-block;

        }



        .project-description {

            padding: 0 15px;
